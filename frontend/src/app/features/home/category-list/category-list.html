<section class="bg-gray-50">
  <div class="mx-auto max-w-6xl px-6 py-14">
    <h2 class="text-3xl font-bold tracking-tight">Explora por categoría</h2>

    <div class="mt-7 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
      @for (category of categories(); track category.id) {
        <div
          class="flex items-center gap-3.5 rounded-xl border border-gray-200 bg-white p-4 font-semibold"
        >
          <span
            class="flex size-11 items-center justify-center rounded-xl bg-primary/10 text-lg font-bold text-primary"
          >
            {{ category.name.charAt(0) }}
          </span>
          {{ category.name }}
        </div>
      }
    </div>
  </div>
</section>
